[package]
name = "SiamMock"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40.0", features = ["full"] }
axum = "0.8.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.140"
log = "0.4.27"
env_logger = "0.11.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }